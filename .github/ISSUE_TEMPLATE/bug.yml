name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and the output you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your tagdock.env and the site file without CONTAINER_CONFIG. Do not paste the container config.
      render: sh
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `docker version --format '{{.Server.Version}}'`, `docker compose version` and the commit or release you use.
    validations:
      required: true
